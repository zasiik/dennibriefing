name: Build a nasazení webu

# Kdy se má spustit:
#  - ráno v 8:30 českého času přes cron-job.org (workflow_dispatch)
#  - ručně tlačítkem "Run workflow" (workflow_dispatch)
#  - po každém nahrání změn (push) — to jen PŘESTAVÍ stránky
#    z existujících dat, NEVOLÁ placené API (viz kroky níže)
on:
  workflow_dispatch:
  push:
    branches: [main]

# Oprávnění nutná pro nasazení na GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Ať neběží dvě nasazení najednou
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    # Pojistka: kdyby se cokoli zaseklo, běh se ukončí po 40 minutách
    # (namluvení podcastu trvá pár minut)
    timeout-minutes: 40
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Stáhnout repozitář
        uses: actions/checkout@v4

      - name: Nastavit Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip   # stažené balíčky (hlavně PyTorch) se drží v cache

      - name: Nainstalovat závislosti
        run: pip install -r requirements.txt

      # Uchová překladovou cache mezi dny, ať se stejné zprávy nepřekládají znovu
      - name: Obnovit překladovou cache
        uses: actions/cache@v4
        with:
          path: preklady_cache.json
          key: preklady-${{ github.run_id }}
          restore-keys: |
            preklady-

      # Uchová archiv minulých vydání (proti opakování témat)
      - name: Obnovit archiv vydání
        uses: actions/cache@v4
        with:
          path: archiv
          key: archiv-${{ github.run_id }}
          restore-keys: |
            archiv-

      # Uchová epizody podcastu (MP3) mezi dny. Kdyby cache vypršela,
      # podcast.py si dosavadní epizody stáhne zpět z živého webu.
      - name: Obnovit epizody podcastu
        uses: actions/cache@v4
        with:
          path: podcast
          key: podcast-${{ github.run_id }}
          restore-keys: |
            podcast-

      # Modely hlasu (Pocket TTS ~400 MB, záložní Piper ~60 MB) – stáhnou
      # se jednou, pak se berou z cache. Změna config.py vytvoří novou cache.
      - name: Obnovit hlas pro podcast
        uses: actions/cache@v4
        with:
          path: |
            hlasy
            ~/.cache/huggingface
            ~/.cache/pocket_tts
          key: hlasy-v2-${{ hashFiles('config.py') }}
          restore-keys: |
            hlasy-v2-

      # Uchová poslední vygenerovaná data — po pushi se z nich web
      # přestaví zadarmo, bez volání Claude API
      - name: Obnovit poslední data
        uses: actions/cache@v4
        with:
          path: |
            data.json
            trhy_data
          key: data-${{ github.run_id }}
          restore-keys: |
            data-

      # Ranní/ruční běh: plné generování (stahuje zprávy, volá Claude API)
      - name: Vygenerovat web (plný běh)
        if: github.event_name != 'push'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ARAD_API_KEY: ${{ secrets.ARAD_API_KEY }}
          # Placené hlasy pro podcast (nepovinné – výchozí Piper je zdarma)
          AZURE_SPEECH_KEY: ${{ secrets.AZURE_SPEECH_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: python3 generuj_web.py

      # Po nahrání změn: jen přestavět stránky z posledních dat — ZDARMA.
      # Kdyby data v cache chyběla, vezmou se rovnou z živého webu.
      - name: Přestavět stránky (po nahrání změn, bez API)
        if: github.event_name == 'push'
        run: |
          if [ ! -f data.json ]; then
            curl -fsSL https://dennibriefing.cz/data.json -o data.json
          fi
          python3 generuj_web.py --jen-html

      # Do složky "public" dáme jen hotové stránky (ne zdrojové skripty)
      - name: Připravit složku k publikování
        run: |
          mkdir -p public
          cp index.html data.html data.json favicon.svg og.png hledani.json podcast-obal.jpg public/
          if [ -d trhy_data ]; then cp -r trhy_data public/; fi
          if [ -f podcast.xml ]; then cp podcast.xml public/; fi
          if [ -d podcast ]; then cp -r podcast public/; fi
          if ls archiv/*.html >/dev/null 2>&1; then
            mkdir -p public/archiv && cp archiv/*.html public/archiv/
          fi
          echo "dennibriefing.cz" > public/CNAME

      - name: Nahrát artefakt pro Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Nasadit na GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
